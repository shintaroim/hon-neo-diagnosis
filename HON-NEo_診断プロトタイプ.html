<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HON-NEo（ホンネヲ）全5種 診断ツール統合プロトタイプ</title>
  <style>
    :root {
      --primary: #2d5a43;
      --primary-light: #e8f0eb;
      --primary-hover: #214332;
      --accent: #d4a373;
      --accent-soft: #faedcd;
      --bg: #f7f5f0;
      --surface: #ffffff;
      --text: #2c302e;
      --text-muted: #6b7280;
      --border: #e3ded6;
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    body {
      background-color: #e9e5dc;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .device-frame {
      width: 100%;
      max-width: 440px;
      height: 860px;
      max-height: 96vh;
      background: var(--bg);
      border-radius: 40px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 9px solid #1f2421;
    }

    .notch {
      width: 130px;
      height: 20px;
      background: #1f2421;
      margin: 0 auto;
      border-radius: 0 0 14px 14px;
      z-index: 20;
      flex-shrink: 0;
    }

    header {
      padding: 10px 14px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 10.5px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .selector-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .mode-select-dropdown {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: #fdfbf7;
      border: 1px solid var(--accent);
      padding: 2px 6px;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
    }

    .mode-button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      width: 100%;
    }

    .mode-tab-btn {
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #faf8f5;
      border-radius: 14px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      flex: 1 1 calc(33.333% - 5px);
      text-align: center;
      white-space: nowrap;
    }

    .mode-tab-btn:nth-child(4),
    .mode-tab-btn:nth-child(5) {
      flex: 1 1 calc(50% - 5px);
    }

    .mode-tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(45, 90, 67, 0.25);
    }

    .content-area {
      flex: 1;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: #e3ded6;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.35s ease;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      animation: fadeIn 0.25s ease;
    }
    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .start-screen {
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px 6px;
      margin: auto 0;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
    }

    .title-large {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      color: var(--text);
    }

    .description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .btn-main {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px 30px;
      font-size: 14.5px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      max-width: 270px;
      box-shadow: 0 4px 12px rgba(45, 90, 67, 0.25);
      transition: all 0.2s;
    }
    .btn-main:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .q-step {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 18px;
      color: var(--text);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 13px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .option-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-1px);
    }
    .option-card:active {
      transform: scale(0.98);
    }

    .option-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ede9e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .loading-screen {
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: auto 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-container {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 16px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }

    .result-tag {
      font-size: 11px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .result-type-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .meter-box {
      margin: 10px 0 14px;
      padding: 12px;
      background: #fbf9f5;
      border-radius: 12px;
      border: 1px dashed var(--border);
    }
    .meter-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .meter-gauge-bg {
      width: 100%;
      height: 12px;
      background: #e5e0d8;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
    }
    .meter-gauge-bar {
      height: 100%;
      background: linear-gradient(90deg, #d4a373, #2d5a43);
      transition: width 0.8s ease;
    }

    .result-desc {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 12px;
      background: #faf8f4;
      padding: 12px;
      border-radius: 12px;
      border-left: 3px solid var(--primary);
    }

    .result-advice {
      font-size: 12.5px;
      line-height: 1.6;
      color: #4b5563;
    }

    .action-box {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 18px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #c29161;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 30px;
      cursor: pointer;
      text-align: center;
    }
    .btn-outline:hover {
      background: #f5f2eb;
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="device-frame">
    <div class="notch"></div>

    <header>
      <div class="brand-bar">
        <div class="brand-title">HON-NEo ｜ ホンネヲ</div>
        <div class="brand-sub" id="brandSubTag">Phase 1：LINE登録</div>
      </div>
      
      <div class="selector-header">
        <div class="selector-label">診断ツールの切り替え（全5種）:</div>
        <select class="mode-select-dropdown" id="modeSelect" onchange="switchMode(this.value)">
          <option value="mode1">① 本音の迷子度</option>
          <option value="mode2">② 3つのブレーキ</option>
          <option value="mode3">③ 3 Compass原石</option>
          <option value="mode4">④ いい人度メーター</option>
          <option value="mode5">⑤ エネルギー漏電</option>
        </select>
      </div>

      <div class="mode-button-grid" id="modeButtons">
        <button class="mode-tab-btn active" data-mode="mode1" onclick="switchMode('mode1')">① 本音の迷子度</button>
        <button class="mode-tab-btn" data-mode="mode2" onclick="switchMode('mode2')">② 3つのブレーキ</button>
        <button class="mode-tab-btn" data-mode="mode3" onclick="switchMode('mode3')">③ 3 Compass原石</button>
        <button class="mode-tab-btn" data-mode="mode4" onclick="switchMode('mode4')">④ いい人度メーター</button>
        <button class="mode-tab-btn" data-mode="mode5" onclick="switchMode('mode5')">⑤ エネルギー漏電</button>
      </div>
    </header>

    <div class="content-area">
      <div class="progress-bar-container" id="progressBarContainer" style="display: none;">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <div class="screen active" id="startScreen">
        <div class="start-screen">
          <span class="badge" id="startBadge">LINE読者限定 30秒診断</span>
          <h1 class="title-large" id="startTitle">あなたの本音の迷子度＆<br>お疲れタイプ診断</h1>
          <p class="description" id="startDesc">
            他人の期待や「ちゃんとしなきゃ」に応えすぎて、<br>
            自分の本当の声が迷子になっていませんか？<br>
            4つの質問であなたの現在地を可視化します。
          </p>
          <button class="btn-main" onclick="startQuiz()">診断をスタートする</button>
        </div>
      </div>

      <div class="screen" id="quizScreen">
        <div class="q-step" id="qStep">QUESTION 1 / 4</div>
        <div class="q-text" id="qText">質問内容</div>
        <div class="options-list" id="optionsContainer"></div>
      </div>

      <div class="screen loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div style="font-weight: 700; font-size: 14.5px; color: var(--primary);" id="loadingMsg">
          本音の周波数を解析中...
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted);">
          少々お待ちください
        </div>
      </div>

      <div class="screen" id="resultScreen">
        <div class="result-container">
          <div class="result-tag" id="resultTag">DIAGNOSIS RESULT</div>
          <h2 class="result-type-title" id="resultTitle">診断タイプ名</h2>
          
          <div id="meterContainer" style="display: none;"></div>

          <div class="result-desc" id="resultDesc">タイプ解説文</div>
          <div class="result-advice" id="resultAdvice">本音を取り戻すための処方箋</div>
        </div>

        <div class="action-box">
          <button class="btn-secondary" id="resultActionBtn" onclick="handleActionClick()">
            📩 処方箋アクションを受け取る
          </button>
          <button class="btn-outline" onclick="resetQuiz()">
            ↺ もう一度診断する
          </button>
        </div>
        <div class="footer-note" id="footerNote">
          ※UTAGEメール統合フォームまたは体験会申込へ接続
        </div>
      </div>
    </div>
  </div>

  <script>

    let currentMode = "mode1";
    let currentQIndex = 0;
    let scores = {};
    let totalScore = 0;

    function switchMode(mode) {
      currentMode = mode;

      document.querySelectorAll('.mode-tab-btn').forEach(btn => {
        if (btn.getAttribute('data-mode') === mode) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const selectEl = document.getElementById("modeSelect");
      if (selectEl) {
        selectEl.value = mode;
      }

      resetQuiz();
    }

    function resetQuiz() {
      currentQIndex = 0;
      scores = {};
      totalScore = 0;
      const data = diagnosisCatalog[currentMode];
      
      document.getElementById("brandSubTag").innerText = data.phase;
      document.getElementById("startBadge").innerText = data.badge;
      document.getElementById("startTitle").innerHTML = data.title;
      document.getElementById("startDesc").innerHTML = data.desc;
      document.getElementById("resultActionBtn").innerText = data.actionText;
      document.getElementById("footerNote").innerText = data.footer;
      document.getElementById("loadingMsg").innerText = data.loadingText;

      document.getElementById("progressBarContainer").style.display = "none";
      document.getElementById("meterContainer").style.display = "none";
      showScreen("startScreen");
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
      currentQIndex = 0;
      scores = {};
      totalScore = 0;
      document.getElementById("progressBarContainer").style.display = "block";
      showQuestion();
      showScreen("quizScreen");
    }

    function showQuestion() {
      const data = diagnosisCatalog[currentMode];
      const q = data.questions[currentQIndex];
      const total = data.questions.length;

      document.getElementById("qStep").innerText = `QUESTION ${currentQIndex + 1} / ${total}`;
      document.getElementById("qText").innerText = q.question;
      document.getElementById("progressBar").style.width = `${((currentQIndex) / total) * 100}%`;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const card = document.createElement("div");
        card.className = "option-card";
        card.innerHTML = `
          <div class="option-num">${idx + 1}</div>
          <div>${opt.text}</div>
        `;
        card.onclick = () => selectOption(opt);
        container.appendChild(card);
      });
    }

    function selectOption(opt) {
      if (opt.type) {
        scores[opt.type] = (scores[opt.type] || 0) + 1;
      }
      if (opt.score !== undefined) {
        totalScore += opt.score;
      }

      currentQIndex++;
      const data = diagnosisCatalog[currentMode];

      if (currentQIndex < data.questions.length) {
        showQuestion();
      } else {
        document.getElementById("progressBar").style.width = `100%`;
        showScreen("loadingScreen");
        setTimeout(showResult, 850);
      }
    }

    function showResult() {
      const data = diagnosisCatalog[currentMode];
      const meterBox = document.getElementById("meterContainer");
      meterBox.style.display = "none";
      meterBox.innerHTML = "";

      let res;

      if (currentMode === "mode4") {
        const avgScore = Math.round(totalScore / data.questions.length);
        if (avgScore < 40) res = data.results.low;
        else if (avgScore < 75) res = data.results.mid;
        else res = data.results.high;

        meterBox.style.display = "block";
        meterBox.innerHTML = `
          <div class="meter-box">
            <div class="meter-label-row">
              <span>ホンネ度：<strong style="color:var(--primary); font-size:14px;">${avgScore}%</strong></span>
              <span>いい人度：<strong style="color:var(--accent); font-size:14px;">${100 - avgScore}%</strong></span>
            </div>
            <div class="meter-gauge-bg">
              <div class="meter-gauge-bar" style="width: ${avgScore}%;"></div>
            </div>
          </div>
        `;
      } 
      else if (currentMode === "mode5") {
        let topType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b, Object.keys(data.results)[0]);
        res = data.results[topType];

        let battery = topType === "brain" ? 25 : (topType === "emotion" ? 20 : 15);
        meterBox.style.display = "block";
        meterBox.innerHTML = `
          <div class="meter-box">
            <div class="meter-label-row">
              <span>心のバッテリー残量</span>
              <span style="color:#d9534f; font-weight:800;">残り ${battery}% (要充電)</span>
            </div>
            <div class="meter-gauge-bg">
              <div class="meter-gauge-bar" style="width: ${battery}%; background:#d9534f;"></div>
            </div>
          </div>
        `;
      }
      else {
        let topType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b, Object.keys(data.results)[0]);
        res = data.results[topType] || Object.values(data.results)[0];
      }

      document.getElementById("resultTitle").innerHTML = res.title;
      document.getElementById("resultDesc").innerHTML = res.desc;
      document.getElementById("resultAdvice").innerHTML = res.advice.replace(/\n/g, "<br>");

      showScreen("resultScreen");
    }

    function handleActionClick() {
      if (currentMode === "mode1") {
        alert("【モック動作】\nUTAGEメールフォームへ遷移し、タイプ別解説レターを配信します。\n（LINEアカウントとメール情報が読者統合されます）");
      } else if (currentMode === "mode2" || currentMode === "mode3") {
        alert("【モック動作】\nUTAGEシナリオ02『3 Compass無料体験会』の申込ページへ遷移します。");
      } else if (currentMode === "mode4") {
        alert("【モック動作】\n結果カード画像を生成し、Instagramストーリーズへのシェアリンクを開きます。");
      } else if (currentMode === "mode5") {
        alert("【モック動作】\n木曜の定期メルマガ（HON-NEo LETTER）特設記事へ遷移します。");
      }
    }

    resetQuiz();
  </script>
